<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能楼宇 3D 可视化系统 - WebGPU</title>
    <style>
        :root {
            --primary: #00d4ff;
            --primary-dim: rgba(0, 212, 255, 0.3);
            --primary-bg: rgba(0, 212, 255, 0.08);
            --bg-dark: #060818;
            --bg-panel: rgba(8, 14, 34, 0.82);
            --text-main: #e8f4ff;
            --text-dim: #6b7a99;
            --accent-warm: #ffaa44;
            --accent-cool: #44aaff;
            --danger: #ff5566;
            --success: #44ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', Arial, sans-serif;
            color: var(--text-main);
            user-select: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container {
            position: absolute;
            inset: 0;
        }

        canvas {
            display: block;
        }

        /* ===== 顶部标题栏 ===== */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 72px;
            background: linear-gradient(180deg, rgba(6, 8, 24, 0.95) 0%, rgba(6, 8, 24, 0.5) 80%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 50;
            pointer-events: none;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.6;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title .logo-mark {
            width: 36px;
            height: 36px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: var(--primary-bg);
        }

        .header-title .logo-mark::before {
            content: '';
            width: 14px;
            height: 14px;
            border: 2px solid var(--primary);
            border-radius: 2px;
            transform: rotate(45deg);
        }

        .header-title h1 {
            font-size: 26px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 4px;
            text-shadow: 0 0 18px rgba(0, 212, 255, 0.4);
        }

        .header-title .subtitle {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .header-right .time {
            color: var(--primary);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        .render-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border: 1px solid var(--primary-dim);
            border-radius: 20px;
            font-size: 12px;
            background: var(--primary-bg);
        }

        .render-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== 左侧控制面板 ===== */
        .panel {
            position: absolute;
            background: var(--bg-panel);
            border: 1px solid var(--primary-dim);
            border-radius: 12px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 40;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            border-bottom: 1px solid var(--primary-dim);
            letter-spacing: 1px;
        }

        .panel-title::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        .control-panel {
            left: 24px;
            top: 96px;
            width: 300px;
            padding-bottom: 8px;
        }

        .control-group {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.12);
        }

        .control-group:last-child {
            border-bottom: none;
        }

        .control-group-label {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-group-label .group-name {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            font-weight: 500;
        }

        .icon-light, .icon-ac, .icon-view {
            width: 16px;
            height: 16px;
            display: inline-block;
            vertical-align: middle;
        }

        .status-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid var(--success);
            color: var(--success);
            background: rgba(68, 255, 136, 0.08);
        }

        .status-tag.off {
            border-color: var(--text-dim);
            color: var(--text-dim);
            background: rgba(107, 122, 153, 0.08);
        }

        .toggle-btn {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--primary-dim);
            background: var(--primary-bg);
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .toggle-btn:hover {
            background: rgba(0, 212, 255, 0.18);
            border-color: var(--primary);
        }

        .toggle-btn.active {
            background: var(--primary);
            color: var(--bg-dark);
            border-color: var(--primary);
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.4);
        }

        .slider-row {
            margin-top: 12px;
        }

        .slider-row .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .slider-row .slider-value {
            color: var(--primary);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .slider-row input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }

        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
        }

        .slider-row input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .view-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* ===== 右侧信息面板 ===== */
        .info-panel {
            right: 24px;
            top: 96px;
            width: 340px;
            display: none;
            padding-bottom: 8px;
        }

        .info-panel.show {
            display: block;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .info-panel .panel-title {
            justify-content: space-between;
        }

        .device-type-badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--primary-bg);
            border: 1px solid var(--primary-dim);
            color: var(--primary);
            margin-left: auto;
        }

        .device-name {
            padding: 12px 20px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid rgba(0, 212, 255, 0.12);
        }

        .info-grid {
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-cell {
            background: rgba(0, 212, 255, 0.05);
            border-left: 2px solid var(--primary);
            border-radius: 4px;
            padding: 10px 12px;
        }

        .info-cell .label {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .info-cell .value {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .info-cell.full {
            grid-column: 1 / -1;
        }

        .close-btn {
            width: 24px;
            height: 24px;
            background: transparent;
            border: 1px solid var(--danger);
            border-radius: 50%;
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 85, 102, 0.15);
        }

        /* ===== 设备列表面板（右侧下方） ===== */
        .device-list-panel {
            right: 24px;
            top: 96px;
            width: 340px;
            padding-bottom: 8px;
        }

        .device-list-panel.hidden {
            display: none;
        }

        .device-list {
            padding: 8px 12px;
            max-height: 360px;
            overflow-y: auto;
        }

        .device-list::-webkit-scrollbar {
            width: 4px;
        }

        .device-list::-webkit-scrollbar-thumb {
            background: var(--primary-dim);
            border-radius: 2px;
        }

        .device-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .device-item:hover {
            background: var(--primary-bg);
        }

        .device-item.active {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid var(--primary-dim);
        }

        .device-item .device-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .device-item.light .device-icon {
            background: rgba(255, 220, 100, 0.15);
            color: #ffdc64;
            border: 1px solid rgba(255, 220, 100, 0.4);
        }

        .device-item.ac .device-icon {
            background: rgba(100, 200, 255, 0.15);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.4);
        }

        .device-item .device-info {
            flex: 1;
            min-width: 0;
        }

        .device-item .device-info .name {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 500;
        }

        .device-item .device-info .meta {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .device-item .device-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
            flex-shrink: 0;
        }

        .device-item .device-status-dot.off {
            background: var(--text-dim);
            box-shadow: none;
        }

        /* ===== 底部状态栏 ===== */
        .status-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0;
            background: var(--bg-panel);
            border: 1px solid var(--primary-dim);
            border-radius: 12px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 40;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .status-item {
            padding: 14px 28px;
            text-align: center;
            border-right: 1px solid rgba(0, 212, 255, 0.12);
            min-width: 120px;
        }

        .status-item:last-child {
            border-right: none;
        }

        .status-item .label {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .status-item .value {
            font-size: 22px;
            color: var(--primary);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .status-item .unit {
            font-size: 12px;
            color: var(--text-dim);
            margin-left: 2px;
        }

        /* ===== 左下角操作提示 ===== */
        .help-hint {
            position: absolute;
            left: 24px;
            bottom: 24px;
            background: var(--bg-panel);
            border: 1px solid var(--primary-dim);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 12px;
            color: var(--text-dim);
            z-index: 40;
            backdrop-filter: blur(10px);
            line-height: 1.8;
        }

        .help-hint .key {
            color: var(--primary);
            font-weight: 600;
        }

        /* ===== 加载动画 ===== */
        .loader {
            position: absolute;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.6s;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-ring {
            width: 70px;
            height: 70px;
            position: relative;
        }

        .loader-ring::before,
        .loader-ring::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
        }

        .loader-ring::before {
            border-top-color: var(--primary);
            border-right-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        .loader-ring::after {
            inset: 8px;
            border-bottom-color: var(--primary);
            border-left-color: var(--primary);
            animation: spin 1.5s linear infinite reverse;
            opacity: 0.5;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--primary);
            margin-top: 24px;
            font-size: 15px;
            letter-spacing: 3px;
        }

        .loader-progress {
            margin-top: 12px;
            width: 220px;
            height: 3px;
            background: rgba(0, 212, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 8px var(--primary);
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: absolute;
            top: 96px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--bg-panel);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 10px 24px;
            color: var(--primary);
            font-size: 14px;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 大屏适配 */
        @media (min-width: 2560px) {
            .header-title h1 { font-size: 34px; }
            .control-panel, .info-panel, .device-list-panel { width: 360px; }
            .status-item .value { font-size: 28px; }
        }
    </style>
  <script type="module" crossorigin src="/assets/index-P-dPyNH1.js"></script>
</head>
<body>
    <div id="app">
        <!-- 加载动画 -->
        <div class="loader" id="loader">
            <div class="loader-ring"></div>
            <div class="loader-text" id="loader-text">正在初始化场景...</div>
            <div class="loader-progress">
                <div class="loader-progress-bar" id="loader-bar"></div>
            </div>
        </div>

        <!-- 3D 画布容器 -->
        <div id="canvas-container"></div>

        <!-- 顶部标题栏 -->
        <div class="header">
            <div class="header-title">
                <div class="logo-mark"></div>
                <div>
                    <h1>智能楼宇 3D 可视化系统</h1>
                    <div class="subtitle">SMART BUILDING VISUALIZATION · WebGPU</div>
                </div>
            </div>
            <div class="header-right">
                <div class="render-badge">
                    <div class="dot" id="render-dot"></div>
                    <span id="render-mode">WebGPU</span>
                </div>
                <div>
                    <div style="font-size:11px;">FPS</div>
                    <div class="time" id="fps-value">--</div>
                </div>
                <div>
                    <div style="font-size:11px;">系统时间</div>
                    <div class="time" id="clock">--:--:--</div>
                </div>
            </div>
        </div>

        <!-- 左侧控制面板 -->
        <div class="panel control-panel">
            <div class="panel-title">系统控制中心</div>

            <div class="control-group">
                <div class="control-group-label">
                    <span class="group-name">
                        <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
                        照明系统
                    </span>
                    <span class="status-tag" id="light-status">运行中</span>
                </div>
                <button class="toggle-btn active" id="lighting-toggle">
                    <span id="lighting-toggle-text">照明已开启</span>
                </button>
                <div class="slider-row">
                    <div class="slider-header">
                        <span>亮度调节</span>
                        <span class="slider-value"><span id="brightness-value">80</span>%</span>
                    </div>
                    <input type="range" id="lighting-brightness" min="0" max="100" value="80">
                </div>
            </div>

            <div class="control-group">
                <div class="control-group-label">
                    <span class="group-name">
                        <svg class="icon-ac" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/></svg>
                        空调系统
                    </span>
                    <span class="status-tag" id="ac-status">运行中</span>
                </div>
                <button class="toggle-btn active" id="ac-toggle">
                    <span id="ac-toggle-text">空调已开启</span>
                </button>
                <div class="slider-row">
                    <div class="slider-header">
                        <span>温度设定</span>
                        <span class="slider-value"><span id="temperature-value">24</span>°C</span>
                    </div>
                    <input type="range" id="ac-temperature" min="16" max="30" value="24">
                </div>
            </div>

            <div class="control-group">
                <div class="control-group-label">
                    <span class="group-name">
                        <svg class="icon-view" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/></svg>
                        视图控制
                    </span>
                </div>
                <div class="view-btns">
                    <button class="toggle-btn" id="auto-rotate">自动旋转</button>
                    <button class="toggle-btn" id="reset-view">重置视角</button>
                    <button class="toggle-btn" id="top-view">俯视视角</button>
                    <button class="toggle-btn" id="toggle-list">设备列表</button>
                </div>
            </div>
        </div>

        <!-- 右侧设备列表面板 -->
        <div class="panel device-list-panel" id="device-list-panel">
            <div class="panel-title">
                设备清单
                <span style="margin-left:auto;font-size:12px;color:var(--text-dim);" id="device-count">0 台</span>
            </div>
            <div class="device-list" id="device-list"></div>
        </div>

        <!-- 右侧设备信息面板 -->
        <div class="panel info-panel" id="info-panel">
            <div class="panel-title">
                设备详情
                <button class="close-btn" id="close-info">×</button>
            </div>
            <div class="device-name" id="device-name">设备名称</div>
            <div class="info-grid" id="device-info-content"></div>
        </div>

        <!-- 底部状态栏 -->
        <div class="status-bar">
            <div class="status-item">
                <div class="label">设备总数</div>
                <div class="value" id="total-devices">0<span class="unit">台</span></div>
            </div>
            <div class="status-item">
                <div class="label">运行设备</div>
                <div class="value" id="active-devices">0<span class="unit">台</span></div>
            </div>
            <div class="status-item">
                <div class="label">总功率</div>
                <div class="value" id="total-power">0<span class="unit">kW</span></div>
            </div>
            <div class="status-item">
                <div class="label">平均温度</div>
                <div class="value" id="avg-temp">24<span class="unit">°C</span></div>
            </div>
            <div class="status-item">
                <div class="label">环境照度</div>
                <div class="value" id="lux-value">500<span class="unit">lx</span></div>
            </div>
            <div class="status-item">
                <div class="label">能耗等级</div>
                <div class="value" id="energy-level" style="font-size:18px;">A</div>
            </div>
        </div>

        <!-- 左下角操作提示 -->
        <div class="help-hint">
